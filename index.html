"src/core/random.js":function(require,module,exports){
function nextRandom(n){let x=n>>>0||1;x^=x<<13;x^=x>>>17;x^=x<<5;return {rngState:x>>>0,value:(x>>>0)/4294967296};}
function random(state){const n=nextRandom(state.rngState);state.rngState=n.rngState;return n.value;}
function pick(state,list){return list[Math.floor(random(state)*list.length)];}
module.exports={nextRandom,random,pick};

},
"src/core/market.js":function(require,module,exports){
const {STOCKS}=require('../config/stocks');const {EVENTS}=require('../config/events');const {random,pick}=require('./random');const {clone}=require('./portfolio');const {drawHand}=require('./state');
const clamp=(x,a,b)=>Math.max(a,Math.min(b,x));
function activeEvent(s,id){return s.events.find(e=>e.stockId===id&&!e.resolved);}
function definition(e){return EVENTS.find(d=>d.id===e.templateId);}
function makeEvent(s,id){const d=pick(s,EVENTS.filter(e=>e.stockId===id));s.events.push({id:`${d.id}-${s.day}`,templateId:d.id,stockId:id,start:s.day,due:s.day+d.duration,good:random(s)<d.weight,resolved:false});}
function refreshNews(s){s.news=[];for(const e of s.events){const d=definition(e);if(e.resolved&&e.due===s.day-1)s.news.push({stockId:e.stockId,day:s.day,text:`${d.name}已兑现：${e.good?d.goodFact:d.badFact}`,source:'公司公告'});if(e.resolved)continue;const days=e.due-s.day;s.news.push({stockId:e.stockId,day:s.day,text:days===0?`${d.name}今日公布，等待收盘结果`:`${d.clue} · ${days} 日后公布`,source:'公司公告'});if(days===1)s.news.push({stockId:e.stockId,day:s.day,text:e.good?'业务进展披露积极，但市场预期已有升温':'公司提示进展存在不确定性，需留意风险',source:'行业观察'});}s.news.unshift({day:s.day,stockId:null,text:s.day===1?'开局资金是你的学习缓冲。先看线索，再决定仓位。':`今日生活成本进入第 ${Math.ceil(s.day/7)} 阶段，请预留支付现金。`,source:'市场简报'});}
function initializeMarket(state){const s=clone(state);for(const d of STOCKS){if(!activeEvent(s,d.id))makeEvent(s,d.id);s.stocks[d.id].dailyNoise=(random(s)*2-1)*d.noise;}refreshNews(s);return s;}
function buildMarketResult(s){const result={returns:{},dividends:{},factors:{},notes:{}};for(const d of STOCKS){const st=s.stocks[d.id],e=activeEvent(s,d.id),ed=e&&definition(e);
 const trend=d.trend+st.forecast[0]*(d.noise<=.002?.002:.006),valuation=[.009,.004,0,-.007,-.018][st.valuation],sentiment=(st.sentiment-2)*(d.id==='media'?.009:.0025);
 const event=e&&e.due===s.day?(e.good?ed.good:ed.bad):0;const noise=st.dailyNoise||0;
 const r=clamp(trend+valuation+sentiment+event+noise,-Math.min(.25,d.cap),d.cap);result.returns[d.id]=r;result.factors[d.id]={trend,valuation,sentiment,event,noise};result.notes[d.id]=event?`${ed.name} · ${e.good?'兑现利好':'兑现利空'}`:'趋势与市场定价';
 if(d.id==='bank'&&e&&e.due===s.day&&ed.name==='定期分红')result.dividends[d.id]=Math.round(st.price*(e.good?.02:.008));
 }return result;}
function openNextDay(state){if(state.phase!=='settlement')return {ok:false,state,message:'本局已经结束或尚未收盘'};const s=clone(state);for(const e of s.events)if(e.due===s.day)e.resolved=true;s.day++;s.phase='decision';s.actionsUsed=0;s.usedCards=[];s.effects={};s.financedToday=[];s.flags={};s.report=null;
 for(const d of STOCKS){const st=s.stocks[d.id];st.forecast.shift();st.forecast.push(clamp(st.forecast[st.forecast.length-1]+pick(s,[-1,0,0,1]),-3,3));st.trend=st.forecast[0];st.sentiment=clamp(st.sentiment+pick(s,[-1,0,1]),0,4);if(st.lastReturn>.04)st.valuation=clamp(st.valuation+1,0,4);else if(st.lastReturn<-.04)st.valuation=clamp(st.valuation-1,0,4);st.flow=pick(s,[-1,0,1]);st.dailyNoise=(random(s)*2-1)*d.noise;
  if(!activeEvent(s,d.id)&&random(s)<.45)makeEvent(s,d.id);
 }
 for(const l of s.lots)l.rebate=0;drawHand(s);refreshNews(s);return {ok:true,state:s,message:`第 ${s.day} 日开盘`};}
module.exports={initializeMarket,buildMarketResult,openNextDay,activeEvent,definition};

},

"src/core/portfolio.js":function(require,module,exports){
const clone=s=>JSON.parse(JSON.stringify(s));
const roundQty=q=>Math.floor((q+1e-10)*1e6)/1e6;
const holdings=(s,id)=>s.lots.filter(l=>l.stockId===id);
const quantity=(s,id)=>holdings(s,id).reduce((n,l)=>n+l.qty,0);
const value=(s,id)=>Math.round(quantity(s,id)*s.stocks[id].price);
const grossAssets=s=>s.cash+s.lots.reduce((n,l)=>n+Math.round(l.qty*s.stocks[l.stockId].price),0)+s.shorts.reduce((n,l)=>n+l.margin,0);
const netWorth=s=>grossAssets(s)-s.debt;
function transact(s,fn){try{const d=clone(s);if(d.phase!=='decision')throw Error('请先进入下一个交易日');const message=fn(d);return {ok:true,state:d,message:message||'操作完成'};}catch(e){return {ok:false,state:s,message:e.message};}}
function log(s,message){s.logs.push({day:s.day,message});if(s.logs.length>300)s.logs.shift();}
module.exports={clone,roundQty,holdings,quantity,value,grossAssets,netWorth,transact,log};

},
"src/core/trading.js":function(require,module,exports){
const {roundQty,holdings,quantity,transact,log}=require('./portfolio');
function validStock(s,id){if(!s.stocks[id])throw Error('找不到这支股票');}
function ratio(f){if(!Number.isFinite(f)||f<=0||f>1)throw Error('请选择有效交易比例');}
function doBuy(s,id,f,opts={}){
 validStock(s,id);ratio(f);if(s.flags.noBuy)throw Error('清仓后今日不能买入');
 if(s.shorts.some(l=>l.stockId===id))throw Error('同一股票不能同时做多和做空');
 if(s.effects[id]?.locked)throw Error('满仓持仓已锁定至收盘');
 const own=Math.floor(s.cash*f);if(own<=0)throw Error('可用现金不足');
 const borrowed=Math.min(Math.floor(own*(opts.financeRatio||0)),s.creditLimit-s.debt);
 const qty=roundQty((own+borrowed)/s.stocks[id].price);if(qty<=0)throw Error('金额不足以买入');
 const paid=Math.round(qty*s.stocks[id].price);const actualBorrowed=Math.min(borrowed,paid);s.cash-=paid-actualBorrowed;s.debt+=actualBorrowed;
 s.lots.push({stockId:id,qty,cost:paid,day:s.day,financed:actualBorrowed>0,rebate:opts.rebate||0});
 if(actualBorrowed>0&&!s.financedToday.includes(id))s.financedToday.push(id);
 log(s,`买入 ${id}，投入 ${(paid/100).toFixed(2)}，借款 ${(actualBorrowed/100).toFixed(2)}`);return '买入成功';
}
function doSell(s,id,f,opts={}){
 validStock(s,id);ratio(f);if(s.effects[id]?.locked&&!opts.force)throw Error('满仓持仓已锁定至收盘');
 const lots=holdings(s,id);if(!lots.length)throw Error('没有可卖出的持仓');let proceeds=0;
 for(const l of lots){const sold=f===1?l.qty:roundQty(l.qty*f);proceeds+=Math.round(sold*s.stocks[id].price);const fraction=sold/l.qty;l.cost=Math.round(l.cost*(1-fraction));l.qty=roundQty(l.qty-sold);}
 s.lots=s.lots.filter(l=>l.qty>0);s.cash+=proceeds;log(s,`卖出 ${id}，回收 ${(proceeds/100).toFixed(2)}`);return '卖出成功';
}
const buy=(s,id,f)=>transact(s,d=>doBuy(d,id,f));
const sell=(s,id,f)=>transact(s,d=>doSell(d,id,f));
module.exports={buy,sell,doBuy,doSell,validStock};

},
"src/core/cards.js":function(require,module,exports){
const {CARDS}=require('../config/cards');const {transact,quantity,holdings,log}=require('./portfolio');const {doBuy,doSell,validStock}=require('./trading');const {doReveal}=require('./information');
function useCard(state,cardId,id,options={}){return transact(state,s=>{
 const card=CARDS.find(c=>c.id===cardId);if(!card||!s.hand.includes(cardId))throw Error('手中没有这张卡');if(s.actionsUsed>=3)throw Error('今日三次行动已用完');if(s.usedCards.includes(cardId))throw Error('同名卡每天只能使用一次');
 if(card.target)validStock(s,id);let message='';
 const effect=()=>s.effects[id]||(s.effects[id]={});
 const requireLong=()=>{if(quantity(s,id)<=0)throw Error('请先持有这支股票');};
 const amplify=type=>{requireLong();if(effect().amplify)throw Error('该股已有收益放大效果');if(s.financedToday.includes(id)||holdings(s,id).some(l=>l.financed))throw Error('融资仓位不能叠加收益放大');effect().amplify=type;};

"src/config/economy.js":function(require,module,exports){
function livingCost(day) {
  if (!Number.isInteger(day) || day < 1) throw new Error('交易日无效');
  if(day<=7)return 25000;
  if(day<=14)return 40000;
  if(day<=21)return 65000;
  if(day<=28)return 100000;
  if(day<=35)return 150000;
  if(day<=45)return 220000;
  let yuan=2200;
  for(let n=0;n<=Math.floor((day-46)/5);n++)yuan=Math.ceil(yuan*1.35);
  return yuan*100;

},

  if(e.amplify==='allin'&&base>0)wanted=Math.round(base*1.25);
  if(e.amplify==='concentrate'&&basis/report.openingGross>.6)wanted=Math.round(base*1.2);
  let exit=false;
  if(e.protect==='hedge')wanted=Math.round(wanted*(wanted<0?.5:.75));
  if(e.protect==='stop'&&wanted/basis<-.06){wanted=Math.round(-basis*.06);exit=true;}
  if(e.protect==='profit'&&wanted/basis>=.08){wanted=Math.round(basis*.08);exit=true;}
  const delta=wanted-base;s.cash+=delta;report.effectDelta+=delta;row.positionReturn=wanted/basis;
  if(exit){doSell(s,row.id,1,{force:true});row.protectedExit=true;}

}

},
